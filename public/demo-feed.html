<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parking camera demo feed</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #18222c; }
      canvas { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <canvas id="camera-feed" width="1280" height="720" aria-label="Animated parking-camera feed"></canvas>
    <script>
      const canvas = document.querySelector('#camera-feed');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const car = (x, y, width, height, color, angle = 0) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = 'rgba(0, 0, 0, .28)';
        ctx.fillRect(-width / 2 + 5, -height / 2 + 7, width, height);
        ctx.fillStyle = color;
        ctx.fillRect(-width / 2, -height / 2, width, height);
        ctx.fillStyle = '#cfe6f5';
        ctx.fillRect(-width * .28, -height * .31, width * .56, height * .2);
        ctx.fillStyle = '#182b39';
        ctx.fillRect(-width * .28, height * .12, width * .56, height * .17);
        ctx.fillStyle = '#121820';
        ctx.fillRect(-width / 2 - 2, -height * .34, 5, height * .68);
        ctx.fillRect(width / 2 - 3, -height * .34, 5, height * .68);
        ctx.restore();
      };
      const line = (x1, y1, x2, y2, color = 'rgba(255,255,255,.46)', width = 3) => {
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      };
      const draw = (now) => {
        const t = now / 1000;
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#5d8098'); sky.addColorStop(.42, '#91aebb'); sky.addColorStop(.421, '#47604f'); sky.addColorStop(1, '#25333a');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

        // Distant buildings and treeline give the frame the slightly imperfect texture of a webcam.
        ctx.fillStyle = '#526b72'; ctx.fillRect(0, 104, W, 154);
        ctx.fillStyle = '#314b42';
        for (let x = -20; x < W; x += 78) {
          const h = 36 + ((x * 19) % 62 + 62) % 62;
          ctx.beginPath(); ctx.arc(x + 44, 239 - h, h * .72, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#7f98a0';
        for (let x = 42; x < W; x += 120) ctx.fillRect(x, 128 + (x % 3) * 9, 54, 76);

        // Road and a long curbside parking lane in perspective.
        ctx.fillStyle = '#39434a';
        ctx.beginPath(); ctx.moveTo(0, 222); ctx.lineTo(W, 212); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#2e373b';
        ctx.beginPath(); ctx.moveTo(0, 332); ctx.lineTo(W, 278); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#9e9d79';
        ctx.beginPath(); ctx.moveTo(0, 327); ctx.lineTo(W, 272); ctx.lineTo(W, 295); ctx.lineTo(0, 351); ctx.closePath(); ctx.fill();
        line(0, 468, W, 382, 'rgba(255,225,133,.66)', 4);
        line(0, 622, W, 502, 'rgba(255,255,255,.27)', 2);
        for (let x = -200; x < W + 200; x += 150) line(x, H, x + 103, 495, 'rgba(255,255,255,.18)', 3);

        // Cars intentionally sit in the three configured default areas.
        car(438, 177, 38, 20, '#d7e0e4', .86);
        car(454, 201, 40, 21, '#b94f44', .86);
        car(471, 228, 42, 22, '#2f607a', .86);
        car(818, 248, 79, 38, '#3d5060', -.03);
        car(810, 255, 68, 32, '#e0e4dd', -.03);
        car(637, 465, 122, 56, '#e0ad45', 1.08);
        car(755, 611, 152, 67, '#376c87', 1.08);

        // Motion outside a region demonstrates why the black mask matters.
        const passing = ((t * 72) % 1540) - 120;
        car(passing, 467 - passing * .095, 99, 43, '#a93744', -.08);
        const cyclistX = ((t * 115) % 1500) - 100;
        ctx.fillStyle = '#111923'; ctx.beginPath(); ctx.arc(cyclistX, 300 + cyclistX * .07, 11, 0, Math.PI * 2); ctx.fill();

        // Camera UI kept subtle, as it would be excluded by the vision mask.
        ctx.fillStyle = 'rgba(8, 16, 24, .58)'; ctx.fillRect(18, 18, 267, 51);
        ctx.fillStyle = '#f8fafc'; ctx.font = '600 18px system-ui'; ctx.fillText('PARK RADAR · CAMERA 01', 32, 49);
        ctx.fillStyle = '#ff4d52'; ctx.beginPath(); ctx.arc(1190, 43, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f8fafc'; ctx.font = '600 16px system-ui'; ctx.fillText('LIVE', 1205, 49);
        ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '16px ui-monospace, monospace';
        ctx.fillText(new Date().toLocaleTimeString('en-GB', { hour12: false }), 1106, 684);
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
